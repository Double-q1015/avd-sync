name: Monthly Full Crawl

on:
  schedule:
    # 每月1号 UTC 时间 02:00 执行（北京时间 10:00）
    - cron: '0 2 1 * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  full-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 全量爬取可能需要较长时间，设置2小时超时
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run full crawler
      run: |
        python main.py --mode full --optimize
      env:
        TZ: Asia/Shanghai
    
    - name: Check database file
      id: check_db
      run: |
        if [ -f "data/cve_database.db" ]; then
          DB_SIZE=$(du -h data/cve_database.db | cut -f1)
          echo "数据库文件大小: $DB_SIZE"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "数据库文件不存在！"
          echo "exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "tag=full-$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
        echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
    
    - name: Create full release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.date.outputs.tag }}
        name: CVE Database Full Update - ${{ steps.date.outputs.month }}
        body: |
          ## CVE数据库全量更新
          
          **发布日期**: ${{ steps.date.outputs.date }}
          **更新类型**: 全量更新（覆盖所有历史数据）
          
          ### 数据库信息
          - 文件: `cve_database.db`
          - 大小: 请查看文件详情
          
          ### 重要说明
          - 这是全量更新，包含所有历史CVE数据
          - 数据已更新到最新状态
          - 建议使用此版本作为主要数据源
          
          ### 使用方法
          1. 下载 `cve_database.db` 文件
          2. 使用SQLite工具打开数据库
          3. 查询CVE信息
          
          ### 数据库结构
          - 主表: `cve_records` - 存储CVE详细信息
          - 统计表: `crawl_stats` - 存储爬取统计信息
          - 历史表: `full_crawl_history` - 存储全量爬取历史
          
          ### 查询示例
          ```sql
          -- 查询所有CVE
          SELECT * FROM cve_records ORDER BY publish_date DESC LIMIT 10;
          
          -- 查询高危漏洞
          SELECT * FROM cve_records WHERE danger_level LIKE '%高%' ORDER BY publish_date DESC;
          
          -- 查询特定CVE
          SELECT * FROM cve_records WHERE cve = 'CVE-2024-XXXX';
          
          -- 查看全量爬取历史
          SELECT * FROM full_crawl_history ORDER BY crawl_date DESC;
          ```
        files: data/cve_database.db
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

